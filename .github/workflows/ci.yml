# CPeople CI: runs on every push to main and on every pull request.
# Steps that need code that doesn't exist yet are skipped until it does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

  e2e:
    name: Playwright end-to-end
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the web app exists
        id: app
        run: echo "exists=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.app.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: lts/*
          cache: pnpm
      - if: steps.app.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.app.outputs.exists == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.app.outputs.exists == 'true'
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.app.outputs.exists == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
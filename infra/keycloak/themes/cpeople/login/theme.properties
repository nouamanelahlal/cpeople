# CPeople sign-in theme.
#
# Templates are inherited from the stock theme and restyled with the ConSAP tokens,
# so every field id the end-to-end tests rely on (#username, #password, #otp) stays
# exactly where Keycloak puts it.
#
# TODO(M02): the approved split-screen designs in docs/design/login*.dc.html need
# template overrides as well; this pass covers colour, type and the logo.
parent=keycloak
import=common/keycloak

locales=en,fr

styles=css/login.css common/keycloak/web_modules/@patternfly/react-core/dist/styles/base.css common/keycloak/web_modules/@patternfly/react-core/dist/styles/app.css node_modules/patternfly/dist/css/patternfly.min.css node_modules/patternfly/dist/css/patternfly-additions.min.css css/cpeople.css

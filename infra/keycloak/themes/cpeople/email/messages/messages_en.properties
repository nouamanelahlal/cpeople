# CPeople e-mail wording, English (M02 / M23).
passwordResetSubject=Choose a new CPeople password
passwordResetBody=Hello,\n\nSomebody asked to reset the password for your CPeople account. Choose a new one here:\n\n{0}\n\nThe link works once and expires in {2}. If this was not you, you can ignore this message: nothing has changed.\n\nCPeople by ConSAP
passwordResetBodyHtml=<p>Hello,</p><p>Somebody asked to reset the password for your CPeople account.</p><p><a href="{0}">Choose a new password</a></p><p>The link works once and expires in {2}. If this was not you, you can ignore this message: nothing has changed.</p>

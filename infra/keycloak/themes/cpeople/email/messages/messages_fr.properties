# CPeople e-mail wording, French. Written for HR staff in Morocco.
passwordResetSubject=Choisissez un nouveau mot de passe CPeople
passwordResetBody=Bonjour,\n\nQuelqu''un a demandé la réinitialisation du mot de passe de votre compte CPeople. Choisissez-en un nouveau ici :\n\n{0}\n\nLe lien ne fonctionne qu''une fois et expire dans {2}. Si vous n''êtes pas à l''origine de cette demande, ignorez ce message : rien n''a changé.\n\nCPeople par ConSAP
passwordResetBodyHtml=<p>Bonjour,</p><p>Quelqu''un a demandé la réinitialisation du mot de passe de votre compte CPeople.</p><p><a href="{0}">Choisir un nouveau mot de passe</a></p><p>Le lien ne fonctionne qu''une fois et expire dans {2}. Si vous n''êtes pas à l''origine de cette demande, ignorez ce message : rien n''a changé.</p>
